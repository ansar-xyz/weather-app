<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="icon" href="./assets/images/favicon.png" type="image/x-icon" />
    <title>Weather App</title>
  </head>

  <body>
    <div class="box">
      <div class="intro">
        <span class="weather-icon"><i class="bi bi-cloud-sun"></i></span>
        <p class="eyebrow">YOUR DAILY FORECAST</p>
        <h1>Weather, at a glance.</h1>
        <p class="description">Find out what the sky has in store for your city.</p>
      </div>

      <label for="cityName">Search for a city</label>
      <div class="search">
        <input type="text" id="cityName" placeholder="For example, Mumbai" />
        <button type="button" onclick="fetchWeather()" aria-label="Search">
          <i class="bi bi-search"></i>
        </button>
      </div>

      <div id="result"></div>
      <p class="footer-note">A little forecast goes a long way.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
